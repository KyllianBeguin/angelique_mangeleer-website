      <!--
        GALERIE — comment l'utiliser :
        - Les œuvres s'enchaînent simplement les unes après les autres, dans l'ordre
          où vous les écrivez ici : elles se placent automatiquement en ligne (3 par
          ligne sur grand écran, 2 puis 1 sur petit écran) et passent à la ligne
          suivante quand il n'y a plus de place. Pas besoin de les répartir
          "à la main" dans des colonnes — ça évite les espaces vides en bas d'une
          colonne trop courte.
        - Chaque œuvre est un bloc <figure class="gallery-item"> avec UNE SEULE légende,
          même si elle contient plusieurs photos.

        → Œuvre avec UNE SEULE photo :
            <figure class="gallery-item">
              <button class="gallery-trigger" type="button">
                <img src="images/NOM-DU-FICHIER.jpg" alt="...">
              </button>
              <figcaption class="gallery-caption">...</figcaption>
            </figure>

        → Œuvre avec PLUSIEURS photos (ex. deux vues de la même pièce) :
            on ajoute juste "gallery-item--multi" sur le <figure>, et on met
            chaque photo (bouton .gallery-trigger) dans un conteneur
            <div class="gallery-item-images"> : elles s'affichent côte à côte
            en colonnes, avec une seule légende commune en dessous.
            (voir l'exemple "Bibidi Bobidi Bou !" ci-dessous — 2 photos, 1 légende)

        - Remplacez src="images/NOM-DU-FICHIER.jpg" par le vrai nom de fichier
          (placez les fichiers dans un dossier "images/" à côté de ce fichier html).
        - alt="..." doit décrire l'image (accessibilité + référencement).
        - La légende (figcaption) suit toujours le même format :
            ligne 1 → Titre (italique), date
            ligne 2 → courte description / matériaux
        - Cliquer sur une image l'ouvre en grand (avec sa légende) ;
          clic sur la croix ou en dehors de l'image referme.
      -->
